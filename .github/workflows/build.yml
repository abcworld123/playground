name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Same arch and Ubuntu release as the Pi, like the other apps under ~/deploy.
    runs-on: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Setup node.js
        uses: actions/setup-node@v6
        with:
          # Must match node in ~/deploy/playground/mise.toml on the Pi.
          node-version: '26'
          cache: 'pnpm'

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Package
        run: |
          mkdir release
          cp -r build/. dist views release/
          tar -czf "playground-${GITHUB_SHA}.tar.gz" -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: playground-${{ github.sha }}.tar.gz
          archive: false
          retention-days: 14
          if-no-files-found: error
